name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.message, '[no release]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        run: |
          git fetch --tags --force

          # Get the latest semver tag
          LATEST_TAG=$(git tag -l 'v*.*.*' | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing release tags found. Starting from v1.0.0"
            MAJOR=1
            MINOR=0
            PATCH=0
            BASE_TAG=""
          else
            echo "Latest release tag found: $LATEST_TAG"
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            BASE_TAG="$LATEST_TAG"
          fi

          # If current commit already has the latest tag attached, skip release
          if [ -n "$LATEST_TAG" ] && git tag --points-at HEAD | grep -q "^${LATEST_TAG}$"; then
            echo "Current commit is already tagged as $LATEST_TAG. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get commit messages since latest tag
          if [ -n "$BASE_TAG" ]; then
            COMMITS=$(git log "${BASE_TAG}..HEAD" --pretty=format:"%s%n%b")
          else
            COMMITS=$(git log --pretty=format:"%s%n%b")
          fi

          # If no new commits found, skip
          if [ -z "$COMMITS" ]; then
            echo "No new commits since $BASE_TAG. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump level (major, minor, or patch)
          if echo "$COMMITS" | grep -Eq 'BREAKING CHANGE|breaking:|^[a-z]+(\([a-z0-9_-]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eq '^(feat|feature)(\([a-z0-9_-]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "Determined bump type: $BUMP"

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          elif [ "$BUMP" = "major" ]; then
            NEXT_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          NEXT_TAG="v${NEXT_VERSION}"
          echo "Computed next tag: $NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.semver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.next_tag }}
          name: ${{ steps.semver.outputs.next_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
